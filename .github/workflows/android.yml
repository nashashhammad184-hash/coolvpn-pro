name: Build Android App
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip and Find Android Project
      run: |
        unzip -o *.zip
        echo "Searching for build.gradle..."
        GRADLE_PATH=$(find . -name "build.gradle" -not -path "*/api-server/*" | head -n 1)
        if [ -z "$GRADLE_PATH" ]; then
          echo "Error: build.gradle not found anywhere in the zip!"
          exit 1
        fi
        ANDROID_DIR=$(dirname "$GRADLE_PATH")
        echo "Found android project directory at: $ANDROID_DIR"
        echo "ANDROID_DIR_PATH=$ANDROID_DIR" >> $GITHUB_ENV

    - name: Create Production Keystore
      run: |
        keytool -genkeypair -v -keystore ${{ env.ANDROID_DIR_PATH }}/app/coolvpn.keystore -alias ${{ secrets.COOLVPN_KEY_ALIAS }} -keypass ${{ secrets.COOLVPN_KEY_PASSWORD }} -storepass ${{ secrets.COOLVPN_STORE_PASSWORD }} -dname "CN=Nashash, O=CoolVPN, C=US" -keyalg RSA -keysize 2048 -validity 10000
      continue-on-error: true

    - name: Build Global Production APK
      run: |
        cd ${{ env.ANDROID_DIR_PATH }}
        chmod +x gradlew
        ./gradlew assembleRelease
      env:
        COOLVPN_KEY_ALIAS: ${{ secrets.COOLVPN_KEY_ALIAS }}
        COOLVPN_KEY_PASSWORD: ${{ secrets.COOLVPN_KEY_PASSWORD }}
        COOLVPN_STORE_PASSWORD: ${{ secrets.COOLVPN_STORE_PASSWORD }}

    - name: Upload Store Ready APK
      uses: actions/upload-artifact@v4
      with:
        name: CoolVPN-Universal-Release
        path: "**/build/outputs/apk/release/app-release.apk"
        
