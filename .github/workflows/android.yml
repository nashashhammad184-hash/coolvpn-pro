name: Build Android App
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Structure If Missing
      run: |
        mkdir -p android/app/src/main
        if [ ! -f "android/build.gradle" ]; then
          cat << 'EOF' > android/build.gradle
          buildscript {
              repositories { google() { content { includeGroupByRegex("com\\.android.*") }; metadataSources { artifact() } }; mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:8.2.2" }
          }
          allprojects { repositories { google(); mavenCentral() } }
        EOF
        fi
        if [ ! -f "android/app/build.gradle" ]; then
          cat << 'EOF' > android/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.nashash.coolvpn'
              compileSdk 34
              defaultConfig { applicationId "com.nashash.coolvpn"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
              buildTypes { release { minifyEnabled false } }
          }
        EOF
        fi
        if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://android.com">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.BIND_VPN_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <application android:label="CoolVPN Pro" android:allowBackup="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
                  <service android:name=".vpn.ConnectionForegroundService" android:permission="android.permission.BIND_VPN_SERVICE" android:foregroundServiceType="specialUse" android:exported="false"/>
              </application>
          </manifest>
        EOF
        fi
        mkdir -p android/app/src/main/java/com/nashash/coolvpn/vpn
        cat << 'EOF' > android/app/src/main/java/com/nashash/coolvpn/vpn/ConnectionForegroundService.java
        package com.nashash.coolvpn.vpn;
        import android.net.VpnService;
        public class ConnectionForegroundService extends VpnService {}
        EOF
        cat << 'EOF' > android/app/src/main/java/com/nashash/coolvpn/MainActivity.java
        package com.nashash.coolvpn;
        import android.app.Activity;
        public class MainActivity extends Activity {}
        EOF
        touch android/settings.gradle
        echo "include ':app'" > android/settings.gradle
        wget -q https://githubusercontent.com -O android/gradlew
        mkdir -p android/gradle/wrapper
        wget -q https://githubusercontent.com -O android/gradle/wrapper/gradle-wrapper.properties
        wget -q https://githubusercontent.com -O android/gradle/wrapper/gradle-wrapper.jar

    - name: Create Production Keystore
      run: |
        keytool -genkeypair -v -keystore android/app/coolvpn.keystore -alias ${{ secrets.COOLVPN_KEY_ALIAS }} -keypass ${{ secrets.COOLVPN_KEY_PASSWORD }} -storepass ${{ secrets.COOLVPN_STORE_PASSWORD }} -dname "CN=Nashash, O=CoolVPN, C=US" -keyalg RSA -keysize 2048 -validity 10000
      continue-on-error: true

    - name: Build Global Production APK
      run: |
        cd android && chmod +x gradlew && ./gradlew assembleRelease
      env:
        COOLVPN_KEY_ALIAS: ${{ secrets.COOLVPN_KEY_ALIAS }}
        COOLVPN_KEY_PASSWORD: ${{ secrets.COOLVPN_KEY_PASSWORD }}
        COOLVPN_STORE_PASSWORD: ${{ secrets.COOLVPN_STORE_PASSWORD }}

    - name: Upload Store Ready APK
      uses: actions/upload-artifact@v4
      with:
        name: CoolVPN-Universal-Release
        path: "android/app/build/outputs/apk/release/app-release-apk.apk"
        
